name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      # --- OTA: publish the web bundle so installed apps can self-update ---
      - name: Package OTA web bundle
        run: |
          cd dist && zip -r ../bundle-${{ github.run_number }}.zip . && cd ..
          printf '{"build":%s,"url":"https://github.com/AurumoConsultants/jamalam-mobile/releases/download/ota/bundle-%s.zip"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" > latest.json
          cat latest.json

      - name: Publish OTA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ota --yes --cleanup-tag 2>/dev/null || true
          gh release create ota "bundle-${{ github.run_number }}.zip" latest.json \
            --title "OTA web bundle (build ${{ github.run_number }})" \
            --notes "Automatic over-the-air web self-update bundle."

      # --- Native APK (only needed when native code/permissions change) ---
      - name: Capacitor sync (copy web assets into android project)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jamalam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
